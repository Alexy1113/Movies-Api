# Application Identity
spring.application.name=movies-api

# Database Connection Settings (SQLite)
# The database file 'movies.db' will be created in the project root directory
spring.datasource.url=jdbc:sqlite:movies.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate Configuration
# Using the SQLite dialect to ensure Hibernate generates compatible SQL
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# ddl-auto=update automatically creates/updates database tables based on @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL in the console for debugging purposes
spring.jpa.show-sql=true

# Optional: Format the SQL for better readability in the logs
spring.jpa.properties.hibernate.format_sql=true